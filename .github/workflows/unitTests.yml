name: Unit Tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  unit-tests:
    name: Run Unit Tests
    # Os testes carregam o SDK vendorizado em addon/globalPlugins/operadorIA/lib/,
    # que inclui binarios Windows (_sqlite3.pyd, sqlite3.dll, _pydantic_core*.pyd,
    # _cffi_backend*.pyd) - nao importam em Linux/macOS.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run test suite
        # Testes standalone do operadorIA (sem unittest.TestCase, ver tests/README.md):
        # tests/run_all.py roda tudo exceto test_real_api_integration.py (que depende
        # de rede e de uma gemini_api_key configurada, opt-in).
        run: uv run python tests/run_all.py
